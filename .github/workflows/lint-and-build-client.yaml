name: Lint and build (client)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - parelpracht-client
  pull_request:
    branches:
      - main
      - develop
    paths:
      - parelpracht-client

jobs:
  build-and-lint:
    uses: GEWIS/actions/.github/workflows/lint-and-build-yarn.yml@v1
    with:
      node-version: '20.x'
      lint: true
      format: false
      build: true
      working-directory: parelpracht-client
