name: Lint and build (client)

on:
  push:
    branches:
      - main
      - develop
      - ci/github-actions
  pull_request:
    branches:
      - main
      - develop
      - ci/github-actions

jobs:
  build-and-lint:
    uses: GEWIS/actions/.github/workflows/lint-and-build-yarn.yml@v1
    with:
      node-version: '20.x'
      lint: true
      format: true
      build: true
      working-directory: parelpracht-client
