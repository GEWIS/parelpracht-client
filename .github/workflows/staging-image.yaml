name: Staging image

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'deploy/**'

jobs:
  build:
    uses: GEWIS/actions/.github/workflows/docker-branch-release.yml@4ea6ab6760d180c2262078cf557e516d01f2f4c0
    with:
      projects: "['parelpracht-client', 'parelpracht-server']"
      docker-registry: 'abc.docker-registry.gewis.nl'
      docker-paths: "['crm/parelpracht/client', 'crm/parelpracht/server']"
      github-registry: 'false'
      build-args: |
        APP_VERSION=develop
        GIT_COMMIT_HASH=${{ github.sha }}
        GIT_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.SVC_GH_PARELPRACHT_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.SVC_GH_PARELPRACHT_PWD }}

  pin:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REGISTRY: abc.docker-registry.gewis.nl
    steps:
      - name: Checkout develop
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: develop

      - name: Install kustomize
        run: |
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz" | tar -xz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/

      - name: Pin staging images to the new :develop digests
        env:
          REGISTRY_USERNAME: ${{ secrets.SVC_GH_PARELPRACHT_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.SVC_GH_PARELPRACHT_PWD }}
        run: |
          echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin
          for app in client server; do
            ref="${REGISTRY}/crm/parelpracht/${app}"
            digest="$(docker buildx imagetools inspect "${ref}:develop" --format '{{.Manifest.Digest}}')"
            (cd deploy/staging && kustomize edit set image "${ref}@${digest}")
          done

      - name: Commit the pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- deploy/staging/kustomization.yaml; then
            echo "No image change to commit"
          else
            git add deploy/staging/kustomization.yaml
            git commit -m "chore(deploy): pin staging images [skip ci]"
            git push origin HEAD:develop
          fi
